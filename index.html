    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* Cabeçalho com Logo */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header img {
            max-height: 80px;
            width: auto;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .header h2 {
            margin: 0;
            color: #1a365d;
            font-size: 22px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #4a5568;
        }
        input {
            padding: 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-add {
            background-color: #2b6cb0;
            color: white;
            align-self: flex-end;
        }
        .btn-add:hover { background-color: #2c5282; }
        .btn-print {
            background-color: #38a169;
            color: white;
            margin-top: 15px;
        }
        .btn-print:hover { background-color: #2f855a; }
        
        /* Dashboard de Médias */
        .cards {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            flex: 1;
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .card span {
            display: block;
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
        }
        .card strong {
            font-size: 20px;
            color: #2d3748;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 8px;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: #f7fafc;
            color: #4a5568;
        }

        /* Formatação Específica para Impressão */
        @media print {
            body { 
                background: white; 
                margin: 0; 
                padding: 0;
            }
            .container { 
                box-shadow: none; 
                width: 100%; 
                max-width: none; 
                padding: 0; 
            }
            .no-print { 
                display: none !important; 
            }
            input { 
                border: none; 
                font-weight: bold; 
                background: transparent; 
                padding: 0;
                font-size: 16px;
                color: #000;
            }
            
            /* Garantindo o Logo e o Header na impressão */
            .header {
                border-bottom: 2px solid #ccc;
            }
            .header img {
                display: block !important;
                max-height: 80px;
            }
            
            /* Melhor contraste para a tabela na impressão */
            th, td {
                border: 1px solid #000;
                color: #000;
            }
            th {
                background-color: #e2e8f0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            /* Cards na impressão */
            .card {
                border: 1px solid #000;
                background-color: transparent !important;
            }
            .card strong { color: #000 !important; }
        }
    </style>
</head>

            <!-- Linhas geradas via JavaScript -->
        </tbody>
    </table>

    <button class="btn-print no-print" onclick="window.print()">Imprimir / Gerar PDF</button>
</div>

<script>
    let abastecidas = [];

    function verificarEnter(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            adicionarRegistro();
        }
    }

    function adicionarRegistro() {
        const horimetroInput = document.getElementById('horimetro');
        const litrosInput = document.getElementById('litros');
        
        const horimetro = parseFloat(horimetroInput.value);
        const litros = parseFloat(litrosInput.value);

        if (isNaN(horimetro) || isNaN(litros) || horimetro <= 0 || litros <= 0) {
            alert('Por favor, preencha o horímetro e os litros corretamente.');
            return;
        }

        if (abastecidas.length > 0) {
            const ultimoHorimetro = abastecidas[abastecidas.length - 1].horimetro;
            if (horimetro <= ultimoHorimetro) {
                alert(`O horímetro atual deve ser maior que o anterior (${ultimoHorimetro} h).`);
                return;
            }
        }

        abastecidas.push({ horimetro, litros });
        
        horimetroInput.value = '';
        litrosInput.value = '';
        horimetroInput.focus();

        atualizarTabela();
    }

    function atualizarTabela() {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';

        let acumuladoHoras = 0;
        let acumuladoLitros = 0;

        abastecidas.forEach((reg, index) => {
            let horasTrabalhadas = 0;
            let mediaTrecho = 0;

            if (index > 0) {
                const horimetroAnterior = abastecidas[index - 1].horimetro;
                horasTrabalhadas = reg.horimetro - horimetroAnterior;
                mediaTrecho = reg.litros / horasTrabalhadas;
                
                acumuladoHoras += horasTrabalhadas;
                acumuladoLitros += reg.litros;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}º</td>
                <td>${reg.horimetro.toFixed(1)}</td>
                <td>${index === 0 ? '-' : horasTrabalhadas.toFixed(1) + ' h'}</td>
                <td>${reg.litros.toFixed(1)} L</td>
                <td>${index === 0 ? '<i>Ponto de Partida</i>' : mediaTrecho.toFixed(2) + ' L/h'}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalHoras').innerText = acumuladoHoras.toFixed(1) + ' h';
        document.getElementById('totalLitros').innerText = acumuladoLitros.toFixed(1) + ' L';
        
        if (acumuladoHoras > 0) {
            const mediaGeral = acumuladoLitros / acumuladoHoras;
            document.getElementById('mediaGeral').innerText = mediaGeral.toFixed(2) + ' L/h';
        } else {
            document.getElementById('mediaGeral').innerText = '0.00 L/h';
        }
    }
</script>

</body>
</html>
